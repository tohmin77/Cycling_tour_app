{% block body %}
<h1>Weather during your tour</h1>

{% else %}<div id="content" data-src="{{ u.part('weather', day.number) }}"></div>{% endif %}
{% endblock %}
{% block scripts %}<script src="{{ u.static('app.js') }}"></script>{% endblock %}
