[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cycling-tour-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "pydantic",
    "httpx",
    "pypdf",
    "anthropic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
